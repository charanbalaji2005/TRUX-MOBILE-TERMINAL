<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="meridianGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Orbital Meridian Ring -->
  <ellipse cx="256" cy="256" rx="210" ry="95" 
           fill="none" 
           stroke="url(#ringGrad)" 
           stroke-width="14" 
           stroke-dasharray="14 10" 
           transform="rotate(-28 256 256)" />

  <!-- Core Angular M Emblem (Terminal Style) -->
  <g fill="none" stroke="url(#meridianGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Terminal Shell Prompt Chevron Left Leg -->
    <polyline points="100,360 100,160 256,290 412,160 412,360" />
    
    <!-- Central Prompt Inner Indicator -->
    <polyline points="190,230 256,285 322,230" stroke-width="20" stroke-opacity="0.7" />
  </g>

  <!-- Meridian Compass Star Element -->
  <g fill="#00E5FF" transform="translate(420, 110)">
    <polygon points="0,-18 5,-5 18,0 5,5 0,18 -5,5 -18,0 -5,-5" />
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
  </g>
</svg>
